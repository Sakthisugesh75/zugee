<svg
  width="120"
  height="120"
  viewBox="0 0 120 120"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <!-- Background aura -->
    <radialGradient id="mascotGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4FDCA8" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#2563EB" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0B0F17" stop-opacity="0" />
    </radialGradient>

    <!-- Robot / Genie Blue-Cyan Gradient -->
    <linearGradient id="bodyGrad" x1="20" y1="15" x2="100" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="45%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Smoke Trail Gradient -->
    <linearGradient id="smokeGrad" x1="60" y1="75" x2="60" y2="115" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#4FDCA8" stop-opacity="0" />
    </linearGradient>

    <!-- Brass / Gold Chest Z Badge -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F1C879" />
      <stop offset="100%" stop-color="#C99A3F" />
    </linearGradient>

    <!-- Glowing Cyan Visor / Eyes -->
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="50%" stop-color="#A5F3FC" />
      <stop offset="100%" stop-color="#4FDCA8" />
    </linearGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="60" cy="55" r="48" fill="url(#mascotGlow)" />

  <!-- Genie Swirl / Smoke Tail -->
  <path
    d="M60 82 C55 88 45 92 48 99 C51 106 65 104 62 110 C60 113 54 114 50 115 C66 116 75 108 72 100 C68 93 54 92 60 82 Z"
    fill="url(#smokeGrad)"
  />

  <!-- Torso & Crossed Arms (Stout, heroic posture) -->
  <path
    d="M40 56 C38 68 45 82 60 82 C75 82 82 68 80 56 C80 52 74 50 60 50 C46 50 40 52 40 56 Z"
    fill="url(#bodyGrad)"
  />
  <!-- Folded Arms Overlay -->
  <path
    d="M34 60 C36 71 48 76 60 76 C72 76 84 71 86 60 C87 56 81 55 76 61 C70 68 50 68 44 61 C39 55 33 56 34 60 Z"
    fill="#1E40AF"
    stroke="#60A5FA"
    stroke-width="1.2"
  />

  <!-- Golden "Z" Chest Badge -->
  <circle cx="60" cy="65" r="8.5" fill="#0B0F17" stroke="url(#goldGrad)" stroke-width="1.5" />
  <path
    d="M56 61.5 H64 L57.5 68.5 H64"
    stroke="url(#goldGrad)"
    stroke-width="1.8"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Helmet Head (Rounded dome robot/genie helmet) -->
  <path
    d="M60 20 C46 20 38 29 38 41 C38 49 44 54 60 54 C76 54 82 49 82 41 C82 29 74 20 60 20 Z"
    fill="url(#bodyGrad)"
    stroke="#60A5FA"
    stroke-width="1.5"
  />

  <!-- Helmet Top Fin / Crest -->
  <path
    d="M57 16 C57 14 63 14 63 16 L62 21 L58 21 Z"
    fill="#93C5FD"
  />

  <!-- Visor Screen (Dark obsidian plate) -->
  <rect x="44" y="32" width="32" height="12" rx="6" fill="#090D14" stroke="#1E293B" stroke-width="1" />

  <!-- Glowing Robot Eyes / Visor Line -->
  <ellipse cx="53" cy="38" rx="4" ry="2.2" fill="url(#eyeGrad)" filter="url(#glowFilter)" />
  <ellipse cx="67" cy="38" rx="4" ry="2.2" fill="url(#eyeGrad)" filter="url(#glowFilter)" />

  <!-- Sparkle Accents -->
  <!-- Top Right Sparkle -->
  <path
    d="M88 22 Q88 28 94 28 Q88 28 88 34 Q88 28 82 28 Q88 28 88 22 Z"
    fill="url(#goldGrad)"
  />
  <!-- Left Side Small Sparkle -->
  <path
    d="M28 44 Q28 48 32 48 Q28 48 28 52 Q28 48 24 48 Q28 48 28 44 Z"
    fill="#67E8F9"
  />
</svg>
